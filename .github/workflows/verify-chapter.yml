name: verify-chapter

# 챕터 초안을 Claude(Sonnet)로 검증한다. 초안을 쓴 에이전트와 분리된 검증 단계.
# - 수동 실행: Actions 탭에서 챕터 경로를 입력
# - PR: 저장소 소유자가 PR에 'verify' 라벨을 붙였을 때, 그 PR에서 바뀐 챕터만
on:
  workflow_dispatch:
    inputs:
      chapter:
        description: "검증할 챕터 경로 (예: docs/java/05-runtime-exception-and-global-handling.md)"
        required: true
        type: string
  pull_request:
    types: [labeled]

concurrency:
  group: verify-chapter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: >
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.label.name == 'verify' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: 검증 대상 챕터 정하기
        id: target
        env:
          INPUT_CHAPTER: ${{ inputs.chapter }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$INPUT_CHAPTER" ]; then
            files="$INPUT_CHAPTER"
          else
            files="$(git diff --name-only "origin/$BASE_REF...HEAD" -- 'docs/*/[0-9][0-9]-*.md' | tr '\n' ' ')"
          fi
          for f in $files; do
            if ! [[ "$f" =~ ^docs/[a-z0-9-]+/[0-9]{2}-[a-z0-9-]+\.md$ ]] || [ ! -f "$f" ]; then
              echo "검증할 수 없는 경로: $f" >&2
              exit 1
            fi
          done
          if [ -z "$files" ]; then echo "바뀐 챕터가 없습니다."; fi
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.target.outputs.files != ''
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - uses: anthropics/claude-code-action@v1
        if: steps.target.outputs.files != ''
        with:
          # Claude 구독으로 실행한다. 로컬에서 `claude setup-token`으로 만든 토큰을 시크릿에 저장한다.
          # API 과금으로 바꾸려면 이 줄을 anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} 로 바꾼다.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            .agents/workflows/verify.md 의 절차를 그대로 따라 다음 챕터를 검증하라: ${{ steps.target.outputs.files }}

            - 먼저 AGENTS.md 와 STYLE.md 를 읽는다.
            - 예제 실행은 `npm run verify:java`, `npm run verify:spring` 을 쓴다.
            - 주장을 확인하는 코드가 더 필요하면 examples/ 아래에 추가하고 실행한다.
            - 보고서는 reviews/<언어>/<챕터 파일 이름> 에 쓴다. 실행으로 확인한 것과 확인하지 못한 것을 구분한다.
            - 챕터 본문은 고치지 않는다. 머리말의 status 와 verified_with 만 바꿀 수 있다.
            - status 를 reviewed 로 바꾸지 않는다.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 60
            --permission-mode default
            --allowedTools "Read,Glob,Grep,Write,Edit,WebSearch,WebFetch,Bash(npm run verify:java),Bash(npm run verify:spring),Bash(java *)"

      - name: 에이전트가 바꾼 범위 확인
        if: steps.target.outputs.files != ''
        run: |
          git add -A
          outside="$(git diff --cached --name-only | grep -v -E '^(reviews|docs|examples)/' || true)"
          if [ -n "$outside" ]; then
            echo "허용되지 않은 경로가 바뀌었습니다:" >&2; echo "$outside" >&2; exit 1
          fi
          if git diff --cached -U0 -- docs | grep -E '^\+status:\s*reviewed'; then
            echo "에이전트는 status: reviewed 를 쓸 수 없습니다." >&2; exit 1
          fi
          body_changes="$(git diff --cached -U0 -- 'docs/*/[0-9][0-9]-*.md' | grep -E '^[+-]' | grep -v -E '^(\+\+\+|---)' | grep -v -E '^[+-](status|verified_with):' || true)"
          if [ -n "$body_changes" ]; then
            echo "챕터 본문이 바뀌었습니다. 검증 단계는 머리말만 바꿀 수 있습니다." >&2; echo "$body_changes" >&2; exit 1
          fi

      - name: 보고서 커밋
        if: steps.target.outputs.files != ''
        run: |
          if git diff --cached --quiet; then echo "바뀐 내용이 없습니다."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add chapter verification report"
          git push
